# G2 数据集配置：各评估集的 data.yaml 路径
# 注：ultralytics pose 的 data.yaml 需含 kpt_shape: [17, 3]；val 标签在 <val 图片目录>/../labels/val

datasets:
  coco-val:
    # 单次推断双算：val 走 PoseMetrics（is_coco=False，与历史 bench 同口径），
    # official.json 的 pycoco 段由 harness 用 pycocotools 2.0.11 对同一份 preds.json 补算
    # （官方发布数口径，门禁 1 对拍源：M1 纯 NumPy 引擎差 ≤0.5 点）
    data_yaml: /home/ubuntu/isef/eval-harness/configs/coco-val.yaml
    gt_json: /home/ubuntu/isef/datasets/coco2017/annotations/person_keypoints_val2017.json
    status: 就绪
  crowdpose-val:
    data_yaml: /home/ubuntu/isef/eval-harness/configs/crowdpose-val.yaml
    gt_json: /home/ubuntu/isef/datasets/crowdpose/crowdpose_annotations/crowdpose_val_gt17.json
    status: 就绪
  ochuman-test:
    data_yaml: /home/ubuntu/isef/eval-harness/configs/ochuman-test.yaml
    gt_json: /home/ubuntu/isef/datasets/ochuman/ochuman_test_gt.json
    status: 就绪
  posetrack-val:
    # PoseTrack 是每视频独立 COCO JSON（170 个视频 + 3 个 .al 列表文件），不走 data.yaml
    # 由 temporal.py 直接读 ~/isef/datasets/posetrack18/posetrack_data/annotations/val/
    data_yaml: null
    annotations: /home/ubuntu/isef/datasets/posetrack18/posetrack_data/annotations/val
    images: /home/ubuntu/isef/datasets/posetrack18/images/val
    status: 就绪
